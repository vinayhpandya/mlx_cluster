name: MLX Cluster Tests

on:
  pull_request:
    branches: [ "main" ]
  push:
    branches: [ "main" ]

jobs:
  test:
    runs-on: macos-15
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13"]

    steps:
    - uses: actions/checkout@v4
    - name: Set up Python ${{ matrix.python-version }}
      uses: actions/setup-python@v5
      with:
        python-version: ${{ matrix.python-version }}
    - name: Install package and dependencies
      run: |
        python -m pip install --upgrade pip
        python -m pip install "mlx>=0.32" nanobind==3.1.0 "cmake>=3.24" setuptools
        MLX_VERSION=$(python -c "import mlx.core as mx; print(mx.__version__)")
        echo "mlx==$MLX_VERSION" > constraints.txt
        python -m pip install --no-build-isolation -c constraints.txt -e ".[test]" --verbose
        python -c "import mlx.core as mx, mlx_cluster; print('mlx', mx.__version__, 'ok')"
    - name: Run tests with pytest
      run: |
        pytest tests
